[platformio]
; Physical hardware (ILI9341 + XPT2046) is the default target.
; For the Wokwi simulator build explicitly: pio run -e esp32-wroom
default_envs = esp32-hw

[env:esp32-wroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; TFT_eSPI is vendored (patched) in ./lib/TFT_eSPI and auto-discovered from there.
lib_deps =
  adafruit/Adafruit FT6206 Library
build_flags =
  -D WOKWI_CAP_TOUCH
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=27000000
  ; USER_SETUP_LOADED skips User_Setup.h, so its font defines never apply -
  ; without these, _tft->drawString() silently draws with empty font tables
  ; (fonts 1/2/4 are the ones used via drawString(..., <font>) across scenes).
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4

; Real hardware: ILI9341 + XPT2046 resistive touch (SPI, shared bus).
; No WOKWI_CAP_TOUCH -> touch is read via TFT_eSPI getTouch() instead of the FT6206.
[env:esp32-hw]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; TFT_eSPI is vendored (patched) in ./lib/TFT_eSPI and auto-discovered from there.
; When a DS3231 RTC is wired and PET_USE_RTC is set to 1 in src/PetClock.h,
; also uncomment the RTClib dependency below to enable real-time offline decay.
; lib_deps =
;   adafruit/RTClib
build_flags =
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=27000000
  -D SPI_TOUCH_FREQUENCY=2500000
  ; USER_SETUP_LOADED skips User_Setup.h, so its font defines never apply -
  ; without these, _tft->drawString() silently draws with empty font tables
  ; (fonts 1/2/4 are the ones used via drawString(..., <font>) across scenes).
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; TFT_eSPI is vendored (patched) in ./lib/TFT_eSPI and auto-discovered from there.