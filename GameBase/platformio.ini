[platformio]
; Physical hardware (ILI9341 + XPT2046) is the default target.
; For the Wokwi simulator build explicitly: pio run -e esp32-wroom
default_envs = esp32-hw

[env:esp32-wroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; TFT_eSPI is vendored (patched) in ./lib/TFT_eSPI and auto-discovered from there.
lib_deps =
  adafruit/Adafruit FT6206 Library
build_flags =
  -D WOKWI_CAP_TOUCH
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=27000000
  ; USER_SETUP_LOADED skips User_Setup.h, so its font defines never apply -
  ; without these, _tft->drawString() silently draws with empty font tables
  ; (fonts 1/2/4 are the ones used via drawString(..., <font>) across scenes).
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4

; Real hardware: ILI9341 + XPT2046 resistive touch (SPI, shared bus).
; No WOKWI_CAP_TOUCH -> touch is read via TFT_eSPI getTouch() instead of the FT6206.
[env:esp32-hw]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; TFT_eSPI is vendored (patched) in ./lib/TFT_eSPI and auto-discovered from there.
; When a DS3231 RTC is wired and PET_USE_RTC is set to 1 in src/PetClock.h,
; also uncomment the RTClib dependency below to enable real-time offline decay.
; lib_deps =
;   adafruit/RTClib
build_flags =
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=27000000
  -D SPI_TOUCH_FREQUENCY=2500000
  ; USER_SETUP_LOADED skips User_Setup.h, so its font defines never apply -
  ; without these, _tft->drawString() silently draws with empty font tables
  ; (fonts 1/2/4 are the ones used via drawString(..., <font>) across scenes).
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4

; TinyML phase 1: emit gameplay CSV on Serial for dataset collection.
; Usage: pio run -e esp32-tinyml-log -t upload && pio device monitor
[env:esp32-tinyml-log]
extends = env:esp32-hw
build_flags =
  ${env:esp32-hw.build_flags}
  -D TINYML_DATA_LOG=1

; Gesture model phase 1: labelled touch-gesture capture. Adds a dev-only capture
; scene (reachable from Settings) and the high-rate touch sampler, and streams one
; CSV row per sampled point.
; Usage: pio run -e esp32-gesture-log -t upload
;        pio device monitor -b 115200 | python tinyml/download_serial.py --gestures \
;            >> tinyml/data/raw/gestures.csv
[env:esp32-gesture-log]
extends = env:esp32-hw
build_flags =
  ${env:esp32-hw.build_flags}
  -D TINYML_GESTURE_LOG=1

; TinyML phase 3: on-device TFLite Micro inference for the care-action model.
; The model itself is compiled in from src/ml/models/care_action_model.h, which
; tinyml/export_model_header.py regenerates after every training run.
; TensorFlowLite_ESP32 is the Arduino-framework port; the interpreter plus the
; two kernels this model needs costs ~54 KB of flash and ~4.5 KB of RAM.
[env:esp32-tinyml]
extends = env:esp32-hw
lib_deps =
  tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
build_flags =
  ${env:esp32-hw.build_flags}
  -D TINYML_INFERENCE=1

; Gesture model phase 2: on-device gesture recognition. The model is compiled in
; from src/ml/models/gesture_model.h, which tinyml/export_gesture_header.py
; regenerates after every training run. Shares the TFLite Micro interpreter with
; the care-action environment, so enabling both costs one copy of it.
;
; This is the playable gesture build: Scene_PetTotoro binds the classes to Totoro's
; behaviours - poke to get its attention or send it walking, double poke for a
; greeting, brush to pet, swipe to send it off, circle or zigzag to make it dance.
; A hold on the pet is handled live rather than by the model, and opens the radial
; menu the moment it reaches 350 ms, without waiting for the finger to lift; that
; also means gesture builds cannot pick Totoro up, since the hold is spent on the
; menu. Enabling this retires tap-to-open-menu on the pet screen too, since a single
; tap is now a poke - Home still opens the menu instantly. Use esp32-gesture-both to see the model's
; verdict for each stroke next to the gesture you meant to make.
[env:esp32-gesture]
extends = env:esp32-hw
lib_deps =
  tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
build_flags =
  ${env:esp32-hw.build_flags}
  -D TINYML_GESTURE_INFERENCE=1

; Gesture recognition with the capture scene still available, for checking the
; model's answer against the gesture you meant to make.
[env:esp32-gesture-both]
extends = env:esp32-gesture
lib_deps = ${env:esp32-gesture.lib_deps}
build_flags =
  ${env:esp32-gesture.build_flags}
  -D TINYML_GESTURE_LOG=1

; Inference plus CSV logging, to compare the model against the rule oracle live.
[env:esp32-tinyml-both]
extends = env:esp32-tinyml
lib_deps = ${env:esp32-tinyml.lib_deps}
build_flags =
  ${env:esp32-tinyml.build_flags}
  -D TINYML_DATA_LOG=1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; TFT_eSPI is vendored (patched) in ./lib/TFT_eSPI and auto-discovered from there.