[platformio]
; Physical hardware (ILI9341 + XPT2046) is the default target.
; For the Wokwi simulator build explicitly: pio run -e esp32-wroom
default_envs = esp32-hw

[env:esp32-wroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = /Users/Fernando/Documents/Arduino_projects/libraries
lib_deps =
  adafruit/Adafruit FT6206 Library
build_flags =
  -D WOKWI_CAP_TOUCH
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=27000000

; Real hardware: ILI9341 + XPT2046 resistive touch (SPI, shared bus).
; No WOKWI_CAP_TOUCH -> touch is read via TFT_eSPI getTouch() instead of the FT6206.
[env:esp32-hw]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = /Users/Fernando/Documents/Arduino_projects/libraries
build_flags =
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=27000000
  -D SPI_TOUCH_FREQUENCY=2500000

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_extra_dirs = /Users/Fernando/Documents/Arduino_projects/libraries